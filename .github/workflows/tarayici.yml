name: 30 Dakikalik Telegram Taramasi

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-scanner
  cancel-in-progress: true

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Taramayı Çalıştır
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          HEDEF_GRUP_ID: ${{ secrets.HEDEF_GRUP_ID }}
          HEDEFLER_LISTESI: ${{ secrets.HEDEFLER_LISTESI }}
        run: python main.py

      - name: Değişiklikleri Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add islenen_mesajlar.json
          git commit -m "Update state [skip actions]" || echo "Yeni mesaj yok"
          git push origin main || true
